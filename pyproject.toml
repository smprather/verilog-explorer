[project]
name = "verilog-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Myles Prather", email = "smprather@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
verilog-explorer = "verilog_explorer:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
# src layout: the package is importable from src/ as well as from the
# installed editable copy, so a language server resolves it either way.
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
